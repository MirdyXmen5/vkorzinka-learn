services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=vk_learn
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - POSTGRES_DB=vk_learn
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - SECRET_KEY=Glpei^29J@3
      - DEBUG=0
      - DJANGO_ALLOWED_HOSTS=learn.vkorzinka.kz
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./users.csv:/app/users.csv
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
